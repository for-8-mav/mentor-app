<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f4e79">
  <meta name="description" content="Mentor · 大二上学期科研、竞赛、保研、实习与健身计划">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mentor">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Mentor · 学期计划</title>
</head>
<body data-mode="blue">
  <div id="app" class="app">
    <header class="topbar">
      <div class="topbar-copy">
        <p class="topbar-kicker">MENTOR · 大二上</p>
        <h1 id="topbar-title">今日</h1>
      </div>
      <button id="mode-chip" class="mode-chip" type="button" data-action="open-mode" aria-label="切换档位">
        <span class="mode-dot"></span>
        <span id="mode-chip-text">蓝色 · 常规</span>
      </button>
    </header>

    <main id="view" class="view" tabindex="-1"></main>

    <nav class="tabbar" aria-label="主导航">
      <button class="tab is-active" type="button" data-action="switch-tab" data-tab="today">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <span>今日</span>
      </button>
      <button class="tab" type="button" data-action="switch-tab" data-tab="week">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        <span>周计划</span>
      </button>
      <button class="tab" type="button" data-action="switch-tab" data-tab="goals">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
        <span>目标</span>
      </button>
      <button class="tab" type="button" data-action="switch-tab" data-tab="review">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M8 7h8M8 11h8M8 15h5"/></svg>
        <span>复盘</span>
      </button>
      <button class="tab" type="button" data-action="switch-tab" data-tab="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>
        <span>设置</span>
      </button>
    </nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript>
    <div class="noscript">这个应用需要启用 JavaScript。请在浏览器设置中开启后重新打开。</div>
  </noscript>

  <script src="./data/plan.js"></script>
  <script src="./app.js"></script>
</body>
</html>
